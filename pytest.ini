[pytest]
# The test modules import mcp_client and friends from the project root, but
# pytest's default "prepend" import mode only puts the test file's own
# directory (tests/) on sys.path. `python -m pytest` masks that by prepending
# the working directory; the bare `pytest` console script CI runs does not, so
# the import fails there. Putting the root on the path here fixes both.
#
# The path is resolved relative to rootdir — the directory holding this file —
# so it holds no matter which directory pytest was invoked from.
pythonpath = .

testpaths = tests
